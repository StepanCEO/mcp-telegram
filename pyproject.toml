[project]
name = "mcp-telegram"
version = "0.1.0"
description = "MCP server: give Claude/Cursor tools over your personal Telegram — read, search, summarize and send messages"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "telethon>=1.36",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
